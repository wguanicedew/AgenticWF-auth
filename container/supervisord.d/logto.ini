; Logto OSS: OIDC / sign-in on :3001, admin console on :3002.
[program:logto]
command=/usr/local/bin/log-prefix.sh logto /usr/local/bin/start-logto.sh
user=logto
directory=/opt/logto
environment=HOME="/home/logto"
priority=20
autorestart=true
; seeding on first boot can take a while
startsecs=10
startretries=10
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true
