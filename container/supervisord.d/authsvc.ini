; AgenticWF auth service on :8010 (Caddy forward_auth target, browser login).
[program:authsvc]
command=/usr/local/bin/log-prefix.sh authsvc /usr/local/bin/start-authsvc.sh
user=authsvc
directory=/opt/authsvc
environment=HOME="/home/authsvc"
priority=30
autorestart=true
startsecs=3
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true
