; Example backend consuming the AuthContext (authsvc/examples/rest_service.py).
; Not started by default:  supervisorctl start auth:rest-example
[program:rest-example]
command=/usr/local/bin/log-prefix.sh rest-example /opt/authsvc/venv/bin/uvicorn --factory examples.rest_service:create_app --host %(ENV_LISTEN_HOST)s --port 8000
user=authsvc
directory=/opt/authsvc/src
environment=HOME="/home/authsvc",AUTH_CONTEXT_SECRET_FILE="%(ENV_DATA_ROOT)s/secrets/auth_context_secret"
autostart=false
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true
