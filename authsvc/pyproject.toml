[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agenticwf-auth-server"
version = "0.1.0"
description = "AgenticWF auth service: Logto JWT authentication, policy authorization and AuthContext propagation"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "PyJWT[crypto]>=2.8",
    "PyYAML>=6.0",
    "httpx>=0.27",
    "psycopg[binary,pool]>=3.1",
]

[project.optional-dependencies]
test = ["pytest>=8", "opentelemetry-sdk>=1.30"]
# OpenTelemetry tracing and metrics over OTLP/HTTP (docs/deployment.md, Tracing and metrics).
otel = ["opentelemetry-sdk>=1.30", "opentelemetry-exporter-otlp-proto-http>=1.30",
        "opentelemetry-instrumentation-fastapi>=0.51b0", "opentelemetry-instrumentation-httpx>=0.51b0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
